# Formatter-only setup: shfmt for shell, prettier for YAML/Dockerfile/Markdown,
# plus basic whitespace hygiene. Run `pre-commit install` once after cloning.
# One-time reformat: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, -i, "4", -ci] # 4-space indent, indent case blocks

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies: [prettier@3.9.6]
        files: \.(yml|yaml|md|markdown)$|(^|/)Dockerfile$
