# cron-runner: scheduler + runner, one host, one file.
#   cp .env.example .env       (GH_TOKEN, GH_REPO)
#   cp crontab.example crontab (your schedule, gitignored)
#   docker compose up -d --build
name: cron-runner

services:
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: cron-runner-scheduler:latest
    restart: always
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GH_REPO: ${GH_REPO}
    volumes:
      - ./crontab:/etc/crontabs/root:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,size=16m

  runner:
    build:
      context: .
    image: cron-runner:latest
    restart: always
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GH_REPO: ${GH_REPO}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,cron-runner}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 384
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /run:rw,nosuid,size=64m