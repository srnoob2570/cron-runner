# cron-runner: scheduler + runner, one host, one file.
#   cp .env.example .env       (GH_TOKEN, GH_REPO)
#   cp crontab.example crontab (your schedule, gitignored)
#   docker compose up -d --build
name: cron-runner

services:
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: cron-runner-scheduler:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GH_REPO: ${GH_REPO}
    volumes:
      - ./crontab:/etc/crontabs/root:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,size=16m

  runner:
    build:
      context: .
    image: cron-runner:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GH_REPO: ${GH_REPO}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,cron-runner}
      # Point every tool whose cache default lives outside ~/.cache at the
      # one persistent volume below; pip/uv already cache in ~/.cache.
      npm_config_cache: /home/runner/.cache/npm
      GOMODCACHE: /home/runner/.cache/go/mod
      GOCACHE: /home/runner/.cache/go/build
      GRADLE_USER_HOME: /home/runner/.cache/gradle
      CARGO_HOME: /home/runner/.cache/cargo
      RUSTUP_HOME: /home/runner/.cache/rustup
      # Build outputs survive the workspace wipe; cargo reuses them by
      # fingerprint, so only the first job compiles the dep graph.
      CARGO_TARGET_DIR: /home/runner/.cache/target
      # setup-* toolchains persist on the cache volume too.
      RUNNER_TOOL_CACHE: /home/runner/.cache/toolcache
      # AppImage bundling has no FUSE inside the container.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    volumes:
      - runner-cache:/home/runner/.cache
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    pids_limit: 384
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      # exec: jobs run binaries extracted to /tmp (rustup-init, AppImage tools).
      - /tmp:rw,nosuid,exec,size=1g
      - /run:rw,nosuid,size=64m

volumes:
  # One persistent cache for the runner: pip/uv, npm, Go, Gradle, Cargo
  # and the setup-* tool cache, all under /home/runner/.cache.
  runner-cache:
