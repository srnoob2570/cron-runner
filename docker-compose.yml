# Both halves on one host. Each service is defined once in its own compose
# file (also used for split deploys); this file just includes them and adds
# the crontab mount for the file-based schedule path.
name: cron-runner

include:
  - docker-compose.scheduler.yml
  - docker-compose.runner.yml

services:
  scheduler:
    volumes:
      - ./crontab:/etc/crontabs/root:ro