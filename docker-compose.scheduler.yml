# Scheduler only — pair with docker-compose.runner.yml on a Docker host.
# Schedules come from the CRONTAB env var; or uncomment the mount below and
# cp crontab.example crontab.
name: cron-runner-scheduler

services:
  scheduler:
    image: alpine:3.22
    restart: always
    environment:
      GH_TOKEN: ${GH_TOKEN}
      CRONTAB: ${CRONTAB:-}
    volumes:
      - ./scheduler:/scheduler:ro
      # - ./crontab:/etc/crontabs/root:ro
    command: ["/bin/sh", "/scheduler/entrypoint.sh"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,size=16m