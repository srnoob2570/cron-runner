# cron-runner: runner only. Executes queued jobs; dispatching happens elsewhere.
#   cp .env.example .env (GH_TOKEN, GH_REPO)
#   docker compose -f docker-compose.runner.yml up -d --build
name: cron-runner-runner

services:
  runner:
    build:
      context: .
    image: cron-runner:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GH_REPO: ${GH_REPO}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,cron-runner}
      # Point every tool whose cache default lives outside ~/.cache at the
      # one persistent volume below; pip/uv already cache in ~/.cache.
      npm_config_cache: /home/runner/.cache/npm
      GOMODCACHE: /home/runner/.cache/go/mod
      GOCACHE: /home/runner/.cache/go/build
      GRADLE_USER_HOME: /home/runner/.cache/gradle
      CARGO_HOME: /home/runner/.cache/cargo
      # setup-* toolchains persist on the cache volume too.
      RUNNER_TOOL_CACHE: /home/runner/.cache/toolcache
      # AppImage bundling has no FUSE inside the container.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    volumes:
      - runner-cache:/home/runner/.cache
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    pids_limit: 384
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /run:rw,nosuid,size=64m

volumes:
  # One persistent cache for the runner: pip/uv, npm, Go, Gradle, Cargo
  # and the setup-* tool cache, all under /home/runner/.cache.
  runner-cache:
