# Runner only — pair with docker-compose.scheduler.yml (e.g. on a PaaS).
name: cron-runner-runner

services:
  runner:
    build:
      context: .
      args:
        BUN_VERSION: ${BUN_VERSION:-none}
        NODE_VERSION: ${NODE_VERSION:-none}
    image: cron-runner:latest
    restart: always
    environment:
      RUNNER_SCOPE: ${RUNNER_SCOPE:-repo}
      GH_REPO: ${GH_REPO:-}
      GH_ORG: ${GH_ORG:-}
      GH_TOKEN: ${GH_TOKEN:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-cron-runner}
      RUNNER_MAX_LIFETIME: ${RUNNER_MAX_LIFETIME:-86400}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 384
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /run:rw,nosuid,size=64m